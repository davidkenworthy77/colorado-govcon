<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Colorado Governor's Conference on Tourism 2026</title>
<link rel="stylesheet" href="brand/colorado.css" />
<style>
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: var(--sand); color: var(--ink);
    font-family: var(--f-body);
  }
  .card {
    background: var(--paper); padding: 56px 64px 48px;
    max-width: 560px; border-top: 5px solid var(--gold);
  }
  .card img { height: 96px; width: auto; display: block; margin-bottom: 32px; }
  h1 {
    font-family: var(--f-display); font-weight: 400; font-size: 46px;
    line-height: 1.02; letter-spacing: .02em; text-transform: uppercase; margin: 0 0 10px;
  }
  .sub {
    font-family: var(--f-slab); font-size: 12px; letter-spacing: .24em;
    text-transform: uppercase; color: var(--gold-deep); margin: 0 0 28px;
  }
  p.lede { font-size: 16px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 32px; }
  a.go {
    display: block; text-decoration: none; color: var(--ink);
    padding: 18px 0; border-top: 1px solid var(--hairline);
  }
  a.go:last-child { border-bottom: 1px solid var(--hairline); }
  a.go b {
    display: block; font-family: var(--f-display); font-weight: 400; font-size: 24px;
    letter-spacing: .03em; text-transform: uppercase; line-height: 1;
  }
  a.go span { font-size: 14px; color: var(--ink-mute); }
  a.go:hover { color: var(--gold-deep); }
  a.go:hover b { color: var(--gold-deep); }
  .keys {
    margin-top: 28px; font-family: var(--f-mono); font-size: 11px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); line-height: 2;
  }
</style>
</head>
<body>
  <main class="card">
    <img src="brand/logos/govconf.png" alt="Colorado Governor's Conference on Tourism" />
    <p class="sub">Breckenridge · September 23–25, 2026</p>
    <h1>Governor's Conference<br />on Tourism</h1>
    <p class="lede">A digital deck, built as code. Runs from a laptop with the wifi off.</p>

    <a class="go" href="deck/"><b>Open the deck</b><span>The presentation</span></a>
    <a class="go" href="library/"><b>Pattern library</b><span>Every layout, component and chart, live</span></a>

    <p class="keys">
      → next · ← back · N index · S notes · P print notes · F full screen
    </p>
  </main>
</body>
</html>
